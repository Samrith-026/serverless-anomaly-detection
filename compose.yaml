services:
  anomaly-detection:
    build: .
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      ANOMALY_WINDOW_SIZE: 20
      ANOMALY_MIN_SAMPLES: 5
      ANOMALY_SENSITIVITY: 2
      ANOMALY_HISTORY_LIMIT: 1000
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

